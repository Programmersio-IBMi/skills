<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Application Terrain</title>
<script type="importmap">
{"imports":{
  "three":"https://esm.sh/three@0.180.0/webgpu",
  "three/webgpu":"https://esm.sh/three@0.180.0/webgpu",
  "three/tsl":"https://esm.sh/three@0.180.0/tsl",
  "three/addons/":"https://esm.sh/three@0.180.0/examples/jsm/"
}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#03060d;color-scheme: dark}
body{font-family:'Segoe UI',system-ui,sans-serif;color:#dce8f2;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(120,180,230,.25);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,180,230,.45)}

.panel{position:absolute;z-index:20;background:rgba(6,13,24,.80);
  border:1px solid rgba(120,180,230,.18);border-radius:13px;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);padding:12px 16px;
  box-shadow:0 8px 34px rgba(0,0,0,.45)}

/* ── header ── */
#hdr{top:14px;left:14px;max-width:430px}
#hdr h1{font-size:1.1em;letter-spacing:.5px;color:#fff;display:flex;align-items:center;gap:8px}
#hdr h1 b{color:#4fc3f7;font-weight:600}
#hdr h1 .tag{flex:none;font-size:.52em;letter-spacing:2.4px;color:#ffd54a;border:1px solid rgba(255,213,74,.35);
  border-radius:5px;padding:2px 6px;text-transform:uppercase;font-weight:400}
#hdr .sub{font-size:.72em;color:#8fa8bd;margin-top:3px}
#hdr .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:.67em;background:rgba(79,195,247,.10);border:1px solid rgba(79,195,247,.25);
  border-radius:20px;padding:2px 9px;color:#bfe3f7;white-space:nowrap}
.chip.warn{background:rgba(255,213,74,.10);border-color:rgba(255,213,74,.30);color:#ffe18a}
.chip.bad{background:rgba(255,82,82,.10);border-color:rgba(255,82,82,.32);color:#ff9d9d}
.chip.live{background:rgba(105,240,174,.12);border-color:rgba(105,240,174,.35);color:#c8ffe4}

/* ── lens rail ── */
#lensbar{top:14px;left:50%;transform:translateX(-50%);padding:6px 8px 7px;text-align:center}
#lensbar .row1{display:flex;gap:2px}
#lensbar .lens{background:none;border:1px solid transparent;border-radius:9px;
  color:#8fa8bd;padding:6px 14px;font-size:.75em;cursor:pointer;transition:.16s;
  font-family:inherit;letter-spacing:.3px;white-space:nowrap}
#lensbar .lens:hover{color:#eaf4fb;background:rgba(79,195,247,.10)}
#lensbar .lens.on{background:rgba(79,195,247,.22);border-color:rgba(79,195,247,.45);color:#fff}
#lensbar .hint{font-size:.64em;color:#7d94a8;margin-top:4px;letter-spacing:.3px;min-height:1em}

/* ── breadcrumb ── */
#crumb{top:82px;left:50%;transform:translateX(-50%);display:none;padding:6px 14px;
  font-size:.73em;align-items:center;gap:8px;border-color:rgba(255,213,74,.30)}
#crumb.open{display:flex}
#crumb .seg{color:#8fa8bd;cursor:pointer}
#crumb .seg:hover{color:#fff}
#crumb .seg.cur{color:#ffd54a;cursor:default}
#crumb .x{cursor:pointer;color:#7d94a8;font-size:1.1em;line-height:1}
#crumb .x:hover{color:#fff}

/* ── controls ── */
#ctl{top:14px;right:14px;width:258px;max-height:calc(100vh - 186px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(120,180,230,.45) transparent;scrollbar-gutter:stable}
#ctl::-webkit-scrollbar{width:8px}
#ctl::-webkit-scrollbar-thumb{background:rgba(120,180,230,.4);border-radius:4px}
#ctlMore{position:sticky;bottom:-13px;margin:2px -16px -12px;padding:14px 0 7px;display:none;
  text-align:center;font-size:.62em;letter-spacing:1.2px;text-transform:uppercase;color:#7d94a8;
  background:linear-gradient(to bottom,rgba(6,13,24,0),rgba(6,13,24,.93) 55%);pointer-events:none}
#ctlMore.on{display:block}
#ctl input[type=text]{width:100%;background:rgba(255,255,255,.06);
  border:1px solid rgba(120,180,230,.25);border-radius:8px;color:#eaf4fb;
  padding:7px 10px;font-size:.84em;outline:none;font-family:inherit}
#ctl input[type=text]:focus{border-color:rgba(79,195,247,.6)}
#ctl input[type=text]::placeholder{color:#6d8499}
#ctl .row{display:flex;gap:6px;margin-top:8px}
#ctl button{flex:1;background:rgba(79,195,247,.12);color:#bfe3f7;
  border:1px solid rgba(79,195,247,.3);border-radius:8px;padding:6px 4px;
  font-size:.71em;cursor:pointer;transition:background .15s;font-family:inherit}
#ctl button:hover{background:rgba(79,195,247,.28)}
#ctl button.on{background:rgba(79,195,247,.4);color:#fff}
#ctl button.gold{background:rgba(255,213,74,.12);color:#ffe18a;border-color:rgba(255,213,74,.35)}
#ctl button.gold:hover{background:rgba(255,213,74,.3)}
#ctl button:disabled{opacity:.34;cursor:default}
.grp{margin-top:11px;border-top:1px solid rgba(120,180,230,.13);padding-top:9px}
.grp h4{font-size:.62em;color:#7d94a8;text-transform:uppercase;letter-spacing:.9px;
  margin-bottom:6px;display:flex;justify-content:space-between;cursor:default}
.grp h4 em{font-style:normal;color:#4a5f73}
.f{display:flex;align-items:center;gap:7px;font-size:.74em;cursor:pointer;color:#c3d4e2;
  padding:2px 4px;border-radius:5px}
.f:hover{background:rgba(79,195,247,.09)}
.f.off{opacity:.33}
.f .dot{width:10px;height:10px;border-radius:3px;flex:none}
.f .ln{width:16px;height:3px;border-radius:2px;flex:none}
.f .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f .n{margin-left:auto;font-size:.88em;color:#6d8499;padding-left:6px}

/* ── detail ── */
#info{top:196px;left:14px;width:326px;max-height:calc(100vh - 430px);
  overflow-y:auto;display:none}
#info.open{display:block}
#info h2{font-size:1.03em;color:#fff;display:flex;align-items:center;gap:8px;padding-right:20px}
#info h2 .dot{width:12px;height:12px;border-radius:4px;flex:none}
#info .kind{font-size:.67em;color:#8fa8bd;margin:2px 0 8px;text-transform:uppercase;letter-spacing:.8px}
#info .desc{font-size:.79em;color:#cfdde9;margin-bottom:9px;line-height:1.45}
#info .note{font-size:.75em;color:#ffe18a;background:rgba(255,213,74,.07);
  border-left:2px solid rgba(255,213,74,.5);padding:6px 9px;border-radius:0 6px 6px 0;margin-bottom:9px;line-height:1.45}
#info .warn{font-size:.72em;color:#ff9d9d;margin-bottom:8px}
#info .meta{font-size:.71em;color:#8fa8bd;border-top:1px solid rgba(120,180,230,.15);
  padding-top:7px;margin-bottom:9px;line-height:1.65}
#info .meta b{color:#c3d4e2;font-weight:600}
#info h4{font-size:.68em;color:#9fc1d8;text-transform:uppercase;letter-spacing:.8px;margin:11px 0 4px}
#info .conn{font-size:.76em;padding:3px 6px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;gap:7px;color:#cfdde9}
#info .conn:hover{background:rgba(79,195,247,.14)}
#info .conn .dot{width:8px;height:8px;border-radius:2px;flex:none}
#info .conn small{color:#7d94a8;margin-left:auto;padding-left:8px;white-space:nowrap}
#info .conn .xl{color:#ffd54a}
#info .close{position:absolute;top:9px;right:13px;cursor:pointer;color:#7d94a8;font-size:1.1em;line-height:1}
#info .close:hover{color:#fff}
#info .gchip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;
  background:rgba(255,255,255,.05);border:1px solid rgba(120,180,230,.16);
  font-size:.71em;margin:0 4px 4px 0;cursor:pointer}
#info .gchip:hover{border-color:rgba(79,195,247,.5)}
#info .gchip .dot{width:8px;height:8px;border-radius:2px}
#info .why{font-size:.65em;color:#7d94a8;margin:-2px 0 6px 3px;font-family:ui-monospace,Consolas,monospace}

/* ── legend ── */
#legend{bottom:14px;left:14px;font-size:.7em;max-width:340px;padding:10px 14px}
#legend h3{font-size:.9em;color:#9fc1d8;margin-bottom:5px;letter-spacing:.5px;
  display:flex;justify-content:space-between;cursor:pointer}
#legend h3 span{color:#5d7488;font-size:.85em}
#legend .lrow{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:5px}
#legend.min .lrow{display:none}
#legend span.it{display:inline-flex;align-items:center;gap:5px;color:#b7c9d8}
#legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
#legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
#legend .sh{width:11px;height:11px;display:inline-block;background:#8fa8bd}
#legend .fresh{margin-top:6px;padding-top:5px;border-top:1px solid rgba(120,180,230,.13);
  color:#6d8499;font-size:.92em;letter-spacing:.2px}
#legend .fresh b{color:#8fa8bd;font-weight:500}
#legend.min .fresh{margin-top:0;border:none;padding-top:0}

/* ── tour ── */
#tour{bottom:18px;left:50%;transform:translateX(-50%);width:600px;max-width:84vw;
  display:none;text-align:center;border-color:rgba(255,213,74,.35)}
#tour.open{display:block}
#tour h3{color:#ffd54a;font-size:.94em;margin-bottom:4px}
#tour p{font-size:.81em;color:#d7e4ee;line-height:1.55}
#tour .nav{margin-top:9px;display:flex;justify-content:center;gap:8px}
#tour .nav button{background:rgba(255,213,74,.12);color:#ffe18a;
  border:1px solid rgba(255,213,74,.4);border-radius:8px;padding:5px 16px;
  font-size:.74em;cursor:pointer;font-family:inherit}
#tour .nav button:hover{background:rgba(255,213,74,.3)}
#tour .nav button:disabled{opacity:.34;cursor:default}
#tour .step{font-size:.65em;color:#8fa8bd;margin-top:6px;letter-spacing:.4px}

/* ── blast radius ── */
#blast{bottom:18px;left:50%;transform:translateX(-50%);display:none;
  border-color:rgba(105,240,174,.35);text-align:center;min-width:360px;max-width:84vw}
#blast.open{display:block}
#blast h3{color:#69f0ae;font-size:.89em;margin-bottom:5px}
#blast .hops{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:7px 0 5px}
#blast .hop{font-size:.67em;padding:3px 9px;border-radius:6px;
  background:rgba(255,255,255,.05);border:1px solid rgba(120,180,230,.16);color:#8fa8bd}
#blast .hop.on{background:rgba(105,240,174,.22);border-color:rgba(105,240,174,.5);color:#c8ffe4}
#blast p{font-size:.74em;color:#b7c9d8;line-height:1.5}
#blast button{margin-top:8px;background:rgba(105,240,174,.12);color:#c8ffe4;
  border:1px solid rgba(105,240,174,.4);border-radius:8px;padding:4px 14px;
  font-size:.71em;cursor:pointer;font-family:inherit}

/* ── minimap ── */
#mini{bottom:14px;right:14px;padding:8px 9px 6px;z-index:21}
#mini canvas{display:block;border-radius:7px;background:rgba(3,8,16,.7)}
#mini .cap{font-size:.6em;color:#5d7488;letter-spacing:.8px;text-transform:uppercase;
  margin-top:4px;display:flex;justify-content:space-between}
#mini .cap b{color:#8fa8bd;font-weight:500}

/* ── footer ── */
#foot{bottom:14px;right:222px;font-size:.63em;color:#5d7488;background:none;border:none;
  padding:0;box-shadow:none;text-align:right;line-height:1.7;max-width:230px}
#foot b{color:#7d94a8;font-weight:500}
#foot .kbd{border:1px solid rgba(120,180,230,.22);border-radius:4px;padding:0 4px;
  color:#8fa8bd;font-family:ui-monospace,Consolas,monospace;font-size:.95em}

/* ── labels ── */
#labels{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.olabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:11px;letter-spacing:.4px;color:#cfe4f5;text-shadow:0 0 6px #03060d,0 0 12px #03060d;
  padding:1px 5px;border-radius:4px;background:rgba(4,10,18,.55);
  border:1px solid rgba(120,180,230,.14);will-change:transform}
.olabel.sel{color:#fff;border-color:rgba(79,195,247,.6);background:rgba(8,26,44,.86);font-weight:600}
.olabel.hot{color:#c8ffe4;border-color:rgba(105,240,174,.5)}
.tlabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:auto;
  cursor:pointer;font-size:12px;letter-spacing:1.1px;text-transform:uppercase;font-weight:600;
  padding:3px 10px;border-radius:7px;background:rgba(4,10,18,.62);
  border:1px solid rgba(120,180,230,.2);text-shadow:0 0 10px #03060d;will-change:transform}
.tlabel:hover{background:rgba(10,24,40,.92);border-color:rgba(255,213,74,.5)}
.tlabel .n{opacity:.62;font-weight:400;margin-left:6px;letter-spacing:.4px}
.ilabel{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;
  font-size:15px;letter-spacing:4.5px;text-transform:uppercase;color:rgba(190,222,245,.62);
  text-shadow:0 0 18px #03060d;font-weight:300}

/* ── boot / error ── */
#boot{position:absolute;inset:0;display:grid;place-items:center;background:#03060d;
  z-index:60;transition:opacity .55s}
#boot.gone{opacity:0;pointer-events:none}
#boot .in{text-align:center}
#boot .sp{width:32px;height:32px;border:2px solid rgba(120,180,230,.18);
  border-top-color:#4fc3f7;border-radius:50%;margin:0 auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#boot p{font-size:.74em;color:#6d8499;margin-top:13px;letter-spacing:1.4px;text-transform:uppercase}
#err{position:absolute;inset:0;display:none;place-items:center;background:#03060d;z-index:70;padding:30px}
#err.open{display:grid}
#err .box{max-width:620px;border:1px solid rgba(255,82,82,.35);border-radius:13px;
  background:rgba(14,6,10,.85);padding:22px 26px}
#err h2{color:#ff9d9d;font-size:1.05em;margin-bottom:9px}
#err p{font-size:.84em;color:#d7c9cd;line-height:1.6;margin-bottom:8px}
#err code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;color:#ffd54a;
  background:rgba(255,213,74,.08);padding:1px 5px;border-radius:4px;word-break:break-all}
#err .hint{font-size:.76em;color:#8fa8bd;border-top:1px solid rgba(255,255,255,.1);padding-top:9px;margin-top:4px}

#hoverTip{position:absolute;z-index:22;pointer-events:none;display:none;
  background:rgba(6,13,24,.93);border:1px solid rgba(120,180,230,.3);border-radius:8px;
  padding:6px 10px;font-size:11.5px;color:#dce8f2;max-width:260px;line-height:1.45;
  box-shadow:0 6px 22px rgba(0,0,0,.5)}
#hoverTip.on{display:block}
#hoverTip b{color:#4fc3f7}
#hoverTip .k{color:#8fa8bd;font-size:10px;text-transform:uppercase;letter-spacing:.6px}

@media (max-width:1500px){
  #legend{max-width:250px}
  #ctl{max-height:calc(100vh - 232px)}
  #foot{right:14px;bottom:190px;max-width:186px}
  #foot .keys{display:none}
}
@media (prefers-reduced-motion:reduce){
  #boot .sp{animation:none}
}
</style>
</head>
<body>

<div id="stage"></div>
<div id="labels"></div>
<div id="hoverTip"></div>

<div id="hdr" class="panel">
  <h1><span class="tag">terrain</span><b id="hdrRepo">&#183;</b></h1>
  <div class="sub" id="hdrLibs"></div>
  <div class="sub" id="hdrSub"></div>
  <div class="stats" id="stats"></div>
</div>

<div id="lensbar" class="panel">
  <div class="row1" id="lensRow"></div>
  <div class="hint" id="lensHint"></div>
</div>

<div id="crumb" class="panel">
  <span class="seg" id="crumbHome">All islands</span>
  <span style="color:#40556a">&#8250;</span>
  <span class="seg cur" id="crumbCur"></span>
  <span class="x" id="crumbX">&#10005;</span>
</div>

<div id="ctl" class="panel">
  <input type="text" id="search" list="nodeNames" placeholder="&#128269; Find an object&#8230;  ( / )" autocomplete="off">
  <datalist id="nodeNames"></datalist>
  <div class="row">
    <button id="btnTour" class="gold">&#9654; Guided tour</button>
    <button id="btnBlast">&#9678; Blast radius</button>
  </div>
  <div class="row">
    <button id="btnFlow" class="on">Flow: ON</button>
    <button id="btnTop">Top-down</button>
  </div>
  <div class="row">
    <button id="btnBridge">Bridges only</button>
    <button id="btnReset">Reset view</button>
  </div>
  <div class="grp"><h4>Display</h4><div id="fOpts"></div></div>
  <div class="grp"><h4>Territories <em id="grpCount"></em></h4><div id="fGroups"></div></div>
  <div class="grp"><h4>Islands</h4><div id="fLibs"></div></div>
  <div class="grp"><h4>Object kinds</h4><div id="fKinds"></div></div>
  <div class="grp"><h4>Roads</h4><div id="fLinks"></div></div>
  <div id="ctlMore">scroll for more &#9662;</div>
</div>

<div id="info" class="panel">
  <div class="close" id="infoClose">&#10005;</div>
  <h2><span class="dot" id="infoDot"></span><span id="infoName"></span></h2>
  <div class="kind" id="infoKind"></div>
  <div id="infoWarn"></div>
  <div class="desc" id="infoDesc"></div>
  <div id="infoNote"></div>
  <div class="meta" id="infoMeta"></div>
  <div id="infoBody"></div>
</div>

<div id="legend" class="panel">
  <h3 id="legendHead">Legend <span>&#9662;</span></h3>
  <div class="lrow" id="legShapes"></div>
  <div class="lrow" id="legLinks"></div>
  <div class="fresh" id="legFresh"></div>
</div>

<div id="tour" class="panel">
  <h3 id="tourTitle"></h3>
  <p id="tourText"></p>
  <div class="nav">
    <button id="tourPrev">&#8592; Back</button>
    <button id="tourNext">Next &#8594;</button>
    <button id="tourExit">Exit tour</button>
  </div>
  <div class="step" id="tourStep"></div>
</div>

<div id="blast" class="panel">
  <h3 id="blastTitle"></h3>
  <div class="hops" id="blastHops"></div>
  <p id="blastText"></p>
  <button id="blastExit">Close</button>
</div>

<div id="mini" class="panel">
  <canvas id="miniCv" width="360" height="252" style="width:180px;height:126px"></canvas>
  <div class="cap"><span>Minimap</span><b id="miniCap"></b></div>
</div>

<div id="foot" class="panel">
  <div><b id="footBackend">&#8230;</b> &#183; <b id="footFps">&#8230;</b></div>
  <div class="keys"><span class="kbd">B</span> blast <span class="kbd">T</span> tour <span class="kbd">R</span> reset <span class="kbd">/</span> find</div>
</div>

<div id="boot"><div class="in"><div class="sp"></div><p id="bootmsg">laying out the map</p></div></div>

<div id="err"><div class="box">
  <h2 id="errTitle">Map could not be drawn</h2>
  <p id="errBody"></p>
  <div class="hint" id="errHint"></div>
</div></div>

<script type="application/json" id="appmap-data">__APPMAP_DATA__</script>

<script type="module">
/* ═════════════════════════════════════════════════════════════════════════
   APPLICATION TERRAIN — a holographic landscape of an IBM i estate.
   Islands are libraries, hex territories are clusters of the active lens,
   buildings are objects, roads are relationships, bridges cross libraries.
   three.js r180 · WebGPURenderer (WebGL2 fallback) · TSL node materials.
   ═════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const QS = new URLSearchParams(location.search);
const PIN_QUALITY = (QS.get('quality') || '') === 'high';

function fatal(title, body, hint){
  $('errTitle').textContent = title;
  $('errBody').innerHTML = body;
  $('errHint').innerHTML = hint || 'iA support &#183; iASupport@programmers.ai';
  $('err').classList.add('open');
  $('boot').classList.add('gone');
  window.__APPMAP_ERROR = title + ' :: ' + body.replace(/<[^>]+>/g, '');
}
addEventListener('error', e => {
  if(window.__APPMAP || $('err').classList.contains('open')) return;   /* first cause wins */
  fatal('Script error', 'The viewer stopped with <code>' + esc(e.message) + '</code>.');
});

/* ─── 0 · modules (guarded, so a CDN miss names itself) ─────────────────── */
let THREE, TSL, bloom, CameraControls;
const MODS = [
  ['three/webgpu',  async () => { THREE = await import('three/webgpu'); }],
  ['three/tsl',     async () => { TSL   = await import('three/tsl'); }],
  ['three/addons/tsl/display/BloomNode.js',
                    async () => { bloom = (await import('three/addons/tsl/display/BloomNode.js')).bloom; }],
  ['camera-controls@3.1.0',
                    async () => { CameraControls = (await import('https://esm.sh/camera-controls@3.1.0?external=three')).default; }]
];

/* ─── 1 · data + contract ───────────────────────────────────────────────── */
let D;

catch(e){ fatal('The map data is not readable', 'The embedded JSON could not be parsed: <code>' +
  esc(e.message) + '</code>'); throw e; }

const hasV2Shape = D && Array.isArray(D.nodes) && Array.isArray(D.links) &&
                   Array.isArray(D.clusters) && Array.isArray(D.schemes);
const looksV1 = D && (D.meta !== undefined) && (D.desc !== undefined || D.tour !== undefined);
if(looksV1 || (D && D.contract !== undefined && Number(D.contract) !== 2) || !hasV2Shape){
  const why = looksV1
    ? 'This file uses the retired <b>v1</b> App Map contract (<code>meta</code> + hand-written <code>desc</code>/<code>tour</code>).'
    : (D && D.contract !== undefined && Number(D.contract) !== 2)
      ? 'This file declares contract <code>' + esc(D.contract) + '</code>. This viewer reads contract <b>2</b>.'
      : 'This file is missing one of <code>nodes</code>, <code>links</code>, <code>clusters</code>, <code>schemes</code>.';
  fatal('Unsupported App Map file', why +
    '<br><br>Re-export the map with the current iA build engine (on the IBM i, or the ' +
    'workstation fetch script) and rebuild this page.',
    'Contract 2 is described in AppMap_JSON_Contract.md.');
  throw new Error('contract');

const nodes = D.nodes, rawLinks = D.links, clusterRows = D.clusters,
      schemeRows = D.schemes, rules = Array.isArray(D.rules) ? D.rules : [],
      notes = (D.notes && typeof D.notes === 'object') ? D.notes : {};
if(!nodes.length){ fatal('The map is empty', 'The file carries zero objects.'); throw new Error('empty'); }

const kk = (l, n) => l + '/' + n;
const byKey = new Map(), byName = new Map();
nodes.forEach((n, i) => {
  n.i = i; n.id = kk(n.lib, n.name);
  n.lines = +n.lines || 0; n.fin = +n.fin || 0; n.fout = +n.fout || 0; n.seq = +n.seq || 0;
  byKey.set(n.id, n);
  if(!byName.has(n.name)) byName.set(n.name, []);
  byName.get(n.name).push(n);
});
const ruleById = new Map(rules.map(r => [+r.id, r]));

/* libraries: honour the envelope, else derive from the nodes */
let LIBS = Array.isArray(D.libraries) && D.libraries.length
  ? D.libraries.map(l => ({lib: l.lib, seq: +l.seq || 0, descr: l.descr || ''}))
  : [...new Set(nodes.map(n => n.lib))].map(l => ({lib: l, seq: 0, descr: ''}));
LIBS = LIBS.filter(l => nodes.some(n => n.lib === l.lib));
if(!LIBS.length) LIBS = [...new Set(nodes.map(n => n.lib))].map(l => ({lib: l, seq: 0, descr: ''}));
LIBS.sort((a, b) => (a.seq - b.seq) || a.lib.localeCompare(b.lib));
LIBS.forEach((l, i) => { l.k = i; l.count = nodes.filter(n => n.lib === l.lib).length; });
const libOf = new Map(LIBS.map(l => [l.lib, l]));
nodes.forEach(n => { if(!libOf.has(n.lib)){ const l = {lib:n.lib, seq:999, descr:'', k:LIBS.length, count:0};
  LIBS.push(l); libOf.set(n.lib, l); } });
LIBS.forEach(l => l.count = nodes.filter(n => n.lib === l.lib).length);

/* links: resolve cross-library targets by name (prefer tlib, else lowest seq) */
const links = [], dangling = [];
let bridges = 0;
for(const l of rawLinks){
  const s = byKey.get(kk(l.lib, l.src));
  if(!s) continue;
  let t = null;
  if(l.tlib && l.tlib !== l.lib) t = byKey.get(kk(l.tlib, l.tgt)) || null;  /* engine's own answer wins */
  if(!t) t = byKey.get(kk(l.lib, l.tgt)) || null;
  if(!t){
    const cand = byName.get(l.tgt) || [];
    let pick = null;
    if(l.tlib) pick = cand.find(c => c.lib === l.tlib) || null;
    if(!pick && cand.length) pick = cand.reduce((a, b) =>
      (b.seq < a.seq || (b.seq === a.seq && b.lib < a.lib)) ? b : a);
    t = pick;
  }
  if(!t){ dangling.push({s, src: l.src, tgt: l.tgt, kind: l.kind, lib: l.lib}); continue; }
  if(s === t) continue;
  const xlib = t.lib !== s.lib;
  if(xlib) bridges++;
  links.push({s, t, kind: l.kind || 'CALL', hits: +l.hits || 0, flags: l.flags || '',
              job: l.job || '', jobq: l.jobq || '', xlib, i: links.length});
}
nodes.forEach(n => { n.out = []; n.inn = []; n.deg = 0; n.onBridge = false; n.pier = 0; });
links.forEach(e => {
  e.s.out.push(e); e.t.inn.push(e); e.s.deg++; e.t.deg++;
  if(e.xlib){ e.s.onBridge = true; e.t.onBridge = true; }
});
dangling.forEach(d => { if(d.s) d.s.pier++; });
const maxDeg = nodes.reduce((m, n) => Math.max(m, n.deg), 1);
const loadOf = n => n.fin + n.fout || n.deg;          /* fan-in + fan-out = load bearing */
const maxLoad = nodes.reduce((m, n) => Math.max(m, loadOf(n)), 1);

/* ─── 2 · lenses (derived from schemes — nothing hardcoded) ─────────────── */
const LENS_HINT = {AREA:'Business area', MENU:'Menu', LAYER:'Layer',
                   ACTIVITY:'Activity', BATCH:'Batch stream'};
const HINT_ORDER = ['AREA','MENU','LAYER','ACTIVITY','BATCH'];
const titleCase = s => String(s).toLowerCase().replace(/(^|[\s_-])(\w)/g, (m, a, b) => a + b.toUpperCase());
const schemeNames = [...new Set(schemeRows.map(s => s.scheme).concat(clusterRows.map(c => c.scheme)))]
  .filter(Boolean);
schemeNames.sort((a, b) => {
  const ia = HINT_ORDER.indexOf(a), ib = HINT_ORDER.indexOf(b);
  if(ia >= 0 && ib >= 0) return ia - ib;
  if(ia >= 0) return -1;
  if(ib >= 0) return 1;
  return a.localeCompare(b);
});
if(!schemeNames.length){ fatal('No lenses in this file',
  'The map carries no <code>schemes</code> rows, so there is nothing to group the objects by.'); throw new Error('no lens'); }

const schemeDescr = new Map();
for(const s of schemeRows) if(s.descr && !schemeDescr.has(s.scheme)) schemeDescr.set(s.scheme, s.descr);

const PAL = ['#4fc3f7','#ffd54a','#69f0ae','#ff8a9e','#b388ff','#26c6da',
             '#ffa726','#f06292','#9ccc65','#ba68c8','#4dd0e1','#ff7043',
             '#7e9cff','#ffcc80','#80cbc4','#ef9a9a'];
const GREY = '#77909c';
const isFallback = id => /^_/.test(String(id));
const ck = (lib, cid) => lib + '|' + cid;

const LENS = {};
for(const X of schemeNames){
  const prim = new Map(), all = new Map(), cats = new Map();
  for(const c of clusterRows){
    if(c.scheme !== X) continue;
    const n = byKey.get(kk(c.lib, c.name));
    if(!n) continue;
    const id = c.cid == null ? '_NONE' : String(c.cid);
    let nm = c.cname || id;
    /* an ACTIVITY 'NEVER' bucket is source with no compiled object, not dead code */
    if(X === 'ACTIVITY' && id === 'NEVER') nm = 'Source only — no object';
    const key = ck(c.lib, id);
    if(!cats.has(key)) cats.set(key, {key, cid: id, lib: c.lib, nm, n: 0, nodes: []});
    const rec = {key, cid: id, nm, rule: +c.rule || 0, prim: c.prim === 'Y'};
    if(!all.has(n.i)) all.set(n.i, []);
    all.get(n.i).push(rec);
    if(rec.prim && !prim.has(n.i)) prim.set(n.i, rec);       /* primary row wins */
  }
  for(const n of nodes){
    if(!prim.has(n.i)){
      const rs = all.get(n.i);
      if(rs && rs.length) prim.set(n.i, rs[0]);              /* no Y row: first membership */
      else{
        const key = ck(n.lib, '_NONE');
        if(!cats.has(key)) cats.set(key, {key, cid: '_NONE', lib: n.lib, nm: 'Not grouped', n: 0, nodes: []});
        prim.set(n.i, {key, cid: '_NONE', nm: 'Not grouped', rule: 0, prim: true});
        if(!all.has(n.i)) all.set(n.i, []);
      }
    }
  }
  for(const n of nodes){
    const c = cats.get(prim.get(n.i).key);
    c.n++; c.nodes.push(n);
  }
  for(const [key, c] of [...cats]) if(!c.n) cats.delete(key);
  const list = [...cats.values()].sort((a, b) =>
    (libOf.get(a.lib).k - libOf.get(b.lib).k) ||
    (isFallback(a.cid) - isFallback(b.cid)) || (b.n - a.n) || a.cid.localeCompare(b.cid));
  let ci = 0;
  for(const c of list) c.col = isFallback(c.cid) ? GREY : PAL[(ci++) % PAL.length];
  list.forEach((c, i) => { c.k = i; c.nodes.sort((a, b) => loadOf(b) - loadOf(a) || a.name.localeCompare(b.name)); });
  LENS[X] = {id: X, prim, all, list, byKey: new Map(list.map(c => [c.key, c])),
             descr: schemeDescr.get(X) || '', label: LENS_HINT[X] || titleCase(X)};
}
let L = schemeNames[0];
const lensOf = n => LENS[L].prim.get(n.i);
const clusterOf = (n, X) => LENS[X || L].byKey.get(LENS[X || L].prim.get(n.i).key);

/* ─── 4 · deterministic hex layout ──────────────────────────────────────
   No physics. Each library is an island of hex cells; each cluster of the
   active lens grows as a contiguous territory by BFS from a seed placed on
   an outward spiral (biggest innermost, fallback buckets on the rim), with
   one empty ring of buffer between territories. Busiest objects land on the
   seed, quieter ones spiral out. Same input -> same map, every reload.   */
const HEXR = 11;                       // hex circumradius
const HW = Math.sqrt(3) * HEXR;        // column spacing
const HV = 1.5 * HEXR;                 // row spacing
const HDIR = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const hxKey = (q, r) => q + ':' + r;
const hxDist = (q, r) => (Math.abs(q) + Math.abs(q + r) + Math.abs(r)) / 2;
const hxX = (q, r) => HW * (q + r / 2);
const hxZ = (q, r) => HV * r;
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){
  h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const SPIRAL = (() => {                 // cells ordered by ring, deterministic
  const out = [{q:0, r:0, ring:0}];
  for(let ring = 1; ring <= 120; ring++){
    let q = -ring, r = ring;            // start of the ring
    for(let side = 0; side < 6; side++)
      for(let step = 0; step < ring; step++){
        out.push({q, r, ring});
        q += HDIR[side][0]; r += HDIR[side][1];
      }
  }
  return out;
})();
const RING_START = (() => { const m = []; SPIRAL.forEach((c, i) => { if(m[c.ring] === undefined) m[c.ring] = i; }); return m; })();

function layoutIsland(lib, lensId, cap){
  const lens = LENS[lensId];
  const cls = lens.list.filter(c => c.lib === lib);
  const owner = new Map();              // cellKey -> cluster key
  const terr = new Map();               // cluster key -> cells[]
  const place = new Map();              // node index -> {q,r}
  let maxRing = 0;
  const free = (q, r) => !owner.has(hxKey(q, r));
  const claimable = (q, r, key) => {
    if(hxDist(q, r) > cap) return false;               /* stay inside the island */
    if(owner.has(hxKey(q, r))) return false;
    for(const d of HDIR){ const o = owner.get(hxKey(q + d[0], r + d[1])); if(o && o !== key) return false; }
    return true;
  };
  const LAST = RING_START[Math.min(119, cap + 1)] || SPIRAL.length;
  const seedFrom = (startIdx, key) => {
    for(let pass = 0; pass < 2; pass++)                /* a clean seed first, then any free cell */
      for(let i = startIdx; i < LAST; i++){
        const c = SPIRAL[i];
        if(!claimable(c.q, c.r, key)) continue;
        if(pass === 0){
          let clear = true;
          for(const d of HDIR) if(!free(c.q + d[0], c.r + d[1])){ clear = false; break; }
          if(!clear) continue;
        }
        return c;
      }
    return null;
  };
  const grow = (seed, need, key) => {
    const cells = [], seen = new Set([hxKey(seed.q, seed.r)]);
    let queue = [seed];
    while(cells.length < need && queue.length){
      const cur = queue.shift();
      if(!claimable(cur.q, cur.r, key)) continue;
      owner.set(hxKey(cur.q, cur.r), key);
      cells.push(cur);
      maxRing = Math.max(maxRing, hxDist(cur.q, cur.r));
      for(const d of HDIR){
        const nq = cur.q + d[0], nr = cur.r + d[1], k = hxKey(nq, nr);
        if(!seen.has(k)){ seen.add(k); queue.push({q:nq, r:nr}); }
      }
    }
    return cells;
  };

  let shortfall = 0;
  const real = cls.filter(c => !isFallback(c.cid));
  const rim  = cls.filter(c =>  isFallback(c.cid));
  const run = (list, edge) => {
    for(const c of list){
      const start = edge ? Math.min(LAST - 1, RING_START[Math.min(119, Math.ceil(maxRing) + 1)] || 0) : 0;
      let cells = [], guard = 0, from = start, relaxed = !edge;
      while(cells.length < c.n && guard++ < 24){
        const seed = seedFrom(from, c.key);
        if(!seed){
          if(relaxed) break;
          relaxed = true; from = 0; continue;         /* rim first, anywhere second */
        }
        const got = grow(seed, c.n - cells.length, c.key);
        cells = cells.concat(got);
        if(!got.length) from = Math.min(LAST - 1, from + 8);
      }
      if(cells.length < c.n) shortfall += c.n - cells.length;
      terr.set(c.key, cells);
      c.nodes.forEach((n, i) => { const cell = cells[i] || cells[cells.length - 1] || {q:0, r:0};
        place.set(n.i, cell); });
    }
  };
  run(real, false);
  run(rim, true);
  return {owner, terr, place, maxRing, ok: shortfall === 0};
}

/* One layout per (library, lens). An island is the smallest hex disc every lens
   can pack into, so the land reads as settled rather than bare, and it is the
   same disc for every lens so the world never changes shape.                  */
const LAYOUT = {};                       // lensId -> {lib -> island layout}
for(const X of schemeNames) LAYOUT[X] = {};
for(const l of LIBS){
  const want = Math.max(6, l.count * 1.22);             // objects + room for the buffers
  let cap = Math.max(2, Math.ceil((Math.sqrt(12 * want - 3) - 3) / 6));
  for(let tries = 0; tries < 30; tries++, cap++){
    const attempt = {};
    let ok = true;
    for(const X of schemeNames){
      const a = layoutIsland(l.lib, X, cap);
      attempt[X] = a;
      if(!a.ok){ ok = false; break; }
    }
    if(ok || tries === 29){
      for(const X of schemeNames) LAYOUT[X][l.lib] = attempt[X] || layoutIsland(l.lib, X, cap);
      break;
    }
  }
  l.ring = cap + (cap >= 6 ? 1 : 0);                    // a small island cannot afford a spare ring
  l.radius = l.ring * HW;
}
/* islands sit on the water left to right by library sequence */
{
  const GAPC = 6;                        // >= 3 cell widths of water
  let x = 0;
  for(const l of LIBS){ l.cx = x + l.radius; x += l.radius * 2 + GAPC * HW; }
  const span = x - GAPC * HW;
  LIBS.forEach((l, i) => { l.cx -= span / 2;
    l.cz = LIBS.length > 1 ? (i % 2 ? 1 : -1) * l.radius * 0.34 : 0; });
}
const WORLD_R = LIBS.reduce((m, l) => Math.max(m, Math.abs(l.cx) + l.radius), -Infinity) + 60;

/* tiles: every cell of every island, plus its height and terrain colour */
const tiles = [];                        // {lib,q,r,x,z,h,beach,key}
const tileAt = new Map();                // lib|q:r -> tile
for(const l of LIBS){
  const rnd = mulberry(hashStr(l.lib));
  for(const c of SPIRAL){
    if(c.ring > l.ring) break;
    const beach = c.ring >= l.ring;
    const h = beach ? 3.4 + rnd() * 0.6 : 6.4 + rnd() * 2.4;
    const t = {lib: l.lib, q: c.q, r: c.r, ring: c.ring, beach,
               x: l.cx + hxX(c.q, c.r), z: l.cz + hxZ(c.q, c.r), h, key: -1};
    t.idx = tiles.length; tiles.push(t);
    tileAt.set(l.lib + '|' + hxKey(c.q, c.r), t);
  }
}
/* node -> tile, per lens */
const NODE_POS = {};                     // lensId -> Float32Array(3n)
for(const X of schemeNames){
  const arr = new Float32Array(nodes.length * 3);
  for(const n of nodes){
    const cell = LAYOUT[X][n.lib].place.get(n.i) || {q:0, r:0};
    const t = tileAt.get(n.lib + '|' + hxKey(cell.q, cell.r));
    const l = libOf.get(n.lib);
    arr[n.i * 3]     = t ? t.x : l.cx;
    arr[n.i * 3 + 1] = t ? t.h : 6;
    arr[n.i * 3 + 2] = t ? t.z : l.cz;
  }
  NODE_POS[X] = arr;
}
/* live positions (tweened) */
const POS = new Float32Array(NODE_POS[L]);
const FROM = new Float32Array(POS), TO = new Float32Array(POS);
nodes.forEach(n => { n.h = 6.5 + 30 * Math.sqrt(loadOf(n) / maxLoad);
  n.spin = (hashStr(n.id) % 6) * (Math.PI / 3); });

/* ─── 5 · scene ─────────────────────────────────────────────────────────── */
const {vec2, vec3, vec4, float, uv, time, sin, cos, mix, positionWorld, positionLocal,
       attribute, uniform, smoothstep, pow, abs: tabs, clamp, max: tmax, pass} = TSL;

/* starfield + nebula painted once into an equirect canvas — no Points, no
   extra fetch, and it survives both renderer backends */
(function sky(){
  const cv = document.createElement('canvas');
  cv.width = 2048; cv.height = 1024;
  const g = cv.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 1024);
  grd.addColorStop(0, '#02040a'); grd.addColorStop(.52, '#050d1a');
  grd.addColorStop(.72, '#071426'); grd.addColorStop(1, '#02050c');
  g.fillStyle = grd; g.fillRect(0, 0, 2048, 1024);
  const rnd = mulberry(20260915);
  for(let i = 0; i < 5; i++){                       // nebulae
    const x = rnd() * 2048, y = 200 + rnd() * 500, r = 240 + rnd() * 420;
    const n = g.createRadialGradient(x, y, 0, x, y, r);

function fitPose(box, pts, fill){

  const uy0 = -1 + 2 * padB / innerHeight, uy1 = 1 - 2 * padT / innerHeight;

  let d = Math.max(box.max.x - box.min.x, box.max.z - box.min.z, 60) * 1.4;
  fitCam.fov = camera.fov; fitCam.aspect = camera.aspect;
  const tan = Math.tan(camera.fov * Math.PI / 360);

    tgt.set(mid.x - cx * d * tan * fitCam.aspect, 0, mid.z - cy * d * tan / FITDIR.y);
    fitCam.position.copy(tgt).addScaledVector(FITDIR, d);
    fitCam.up.set(0, 1, 0); fitCam.lookAt(tgt);
    fitCam.updateMatrixWorld(true); fitCam.updateProjectionMatrix();

    for(const q of pts){ v.copy(q).project(fitCam);
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
      y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y); }
    const sc = Math.max((x1 - x0) / (2 * hx), (y1 - y0) / (2 * hy));
    if(!isFinite(sc) || sc <= 0) break;
    d *= sc;
    if(Math.abs(sc - 1) < 0.004) break;

  return [pos.x, pos.y, pos.z, tgt.x, tgt.y, tgt.z];

  for(let i = 0; i < POS.length; i++) POS[i] = FROM[i] + (TO[i] - FROM[i]) * e;
  for(let i = 0; i < tileCol.length; i++) tileCol[i] = tileFrom[i] + (tileTo[i] - tileFrom[i]) * e;
  outlineMat.opacity = t < .5 ? 0 : (t - .5) * 1.1;
  if(t >= .5 && !outline.userData.built){ buildOutlines(L); outline.userData.built = 1; }
  needPlace = needPaint = needRoads = true;
  if(t >= 1){ morphing = false; outline.userData.built = 0; outlineMat.opacity = .55; CENT.clear(); }
}

/* ─── 17 · blast radius ─────────────────────────────────────────────────── */
const HOP_MS = 500;
function startBlast(){
  if(!sel) return;
  const hops = [[sel]], seen = new Set([sel]);
  let frontier = [sel];
  while(frontier.length && hops.length < 14){
    const next = [];
    for(const n of frontier){
      for(const e of n.out) if(!seen.has(e.t) && vis(e.t) && linkVis(e)){ seen.add(e.t); next.push(e.t); }
      for(const e of n.inn) if(!seen.has(e.s) && vis(e.s) && linkVis(e)){ seen.add(e.s); next.push(e.s); }
    }
    if(!next.length) break;
    next.sort((a, b) => b.deg - a.deg || a.name.localeCompare(b.name));
    hops.push(next); frontier = next;
  }
  blast = {hops, cur: 0, t0: performance.now(), reached: new Set([sel]), done: false};
  nodes.forEach(n => n.pulse = 0);
  sel.pulse = 1;
  /* pull back far enough to hold the whole wave, so nothing lands off screen */
  {
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    for(const h of hops) for(const n of h){ const o = n.i * 3;
      x0 = Math.min(x0, POS[o]); x1 = Math.max(x1, POS[o]);
      z0 = Math.min(z0, POS[o + 2]); z1 = Math.max(z1, POS[o + 2]); }
    const r = Math.max(60, Math.hypot(x1 - x0, z1 - z0) * .52);
    flyTo((x0 + x1) / 2, 10, (z0 + z1) / 2, r);
  }
  tideMat.opacity = 0; tide.visible = true;
  $('blast').classList.add('open');
  $('tour').classList.remove('open');
  applyBlast();
}
function applyBlast(){
  tileGlow.fill(0);
  for(const n of blast.reached){
    const cell = LAYOUT[L][n.lib].place.get(n.i);
    const t = cell && tileAt.get(n.lib + '|' + hxKey(cell.q, cell.r));
    if(t) tileGlow[t.idx] = 0.55;
    for(const d of HDIR){
      const t2 = cell && tileAt.get(n.lib + '|' + hxKey(cell.q + d[0], cell.r + d[1]));
      if(t2) tileGlow[t2.idx] = Math.max(tileGlow[t2.idx], .18);
    }
  }
  const hop = blast.cur;
  $('blastTitle').textContent = 'Blast radius from ' + sel.name;
  $('blastHops').innerHTML = blast.hops.map((h, i) =>
    '<span class="hop' + (i <= hop ? ' on' : '') + '">' + (i === 0 ? 'start' : 'hop ' + i) + ': ' + h.length + '</span>').join('');
  const reached = blast.reached.size - 1;
  const libs = new Set([...blast.reached].map(n => n.lib));
  $('blastText').innerHTML = reached === 0
    ? 'Nothing else on the map touches ' + esc(sel.name) + ' — it is an island of one.'
    : 'Hop ' + hop + ' of ' + (blast.hops.length - 1) + ' · <b>' + reached + '</b> object' + (reached === 1 ? '' : 's') +
      ' reached across <b>' + libs.size + '</b> librar' + (libs.size === 1 ? 'y' : 'ies') +
      '. Everything lit here is in the path of a change to ' + esc(sel.name) + '.';
  paintStats();
  needPaint = needRoads = true;
  labelPick.dirty = true;
}
function stepBlast(now){
  if(!blast) return;
  const want = Math.min(blast.hops.length - 1, Math.floor((now - blast.t0) / HOP_MS));
  /* tide ring keeps expanding between hops */
  const o = sel.i * 3;
  let maxR = 26;
  for(const n of blast.reached){ const p = n.i * 3;
    maxR = Math.max(maxR, Math.hypot(POS[p] - POS[o], POS[p + 2] - POS[o + 2])); }
  const phase = ((now - blast.t0) % (HOP_MS * 2)) / (HOP_MS * 2);
  tide.position.set(POS[o], POS[o + 1] + 3, POS[o + 2]);
  tide.scale.setScalar(26 + Math.min(maxR + 40, 900) * phase);
  tideMat.opacity = Math.max(0, .34 * (1 - phase)) * (blast.done ? .45 : 1);
  if(want > blast.cur){
    blast.cur = want;
    for(let i = 1; i <= want; i++) for(const n of blast.hops[i]){ blast.reached.add(n); n.pulse = Math.max(.35, 1 - i * .12); }
    applyBlast();
  }
  if(want >= blast.hops.length - 1) blast.done = true;
}
function endBlast(){
  if(!blast) return;
  blast = null;
  nodes.forEach(n => n.pulse = 0);
  tileGlow.fill(0);
  tide.visible = false;
  $('blast').classList.remove('open');
  paintStats();
  needPaint = needRoads = true;
}

/* ─── 18 · drill-down ───────────────────────────────────────────────────── */

  needPaint = needRoads = true;
  labelPick.dirty = true;
  syncHash();
}

/* ─── 19 · guided tour, written from the data at load ───────────────────── */
function buildTour(){
  const t = [];
  const top = (arr, f) => arr.length ? arr.slice().sort((a, b) => f(b) - f(a) || a.name.localeCompare(b.name))[0] : null;
  const real = nodes.filter(n => n.kind !== 'SOURCE');
  const entries = nodes.filter(n => n.kind === 'MENU' || n.kind === 'CMD' || n.layer === 'UI-NAV');
  const entry = top(entries, n => n.out.length);
  const busiest = top(real, n => n.deg) || nodes[0];
  const files = nodes.filter(n => n.kind === 'PF' || n.layer === 'DATA');
  const hub = top(files, n => n.deg);
  const sbm = links.filter(e => e.kind === 'SBMJOB');

  const srcOnly = nodes.filter(n => n.kind === 'SOURCE');
  const xlinks = links.filter(e => e.xlib);
  const fb = [];
  for(const X of schemeNames) for(const c of LENS[X].list) if(isFallback(c.cid) && c.n) fb.push({X, c});
  fb.sort((a, b) => b.c.n - a.c.n);

  t.push({title: 'What you are looking at', text:
    nodes.length + ' objects from ' + nLib + ' librar' + (nLib === 1 ? 'y' : 'ies') + ', drawn as a landscape. ' +
    'Each island is a library. Each glowing region is a ' + LENS[L].label.toLowerCase() + ' — ' + nTerr +
    ' of them on this map — and every building is one object, as tall as the number of things it connects to. ' +
    'Roads are relationships; the particles run the way the data or the call runs.',
    run(){ drill(null); clearSel(); controls.setLookAt(...HOME(), !REDUCED); }});

  if(entry) t.push({title: 'Where a user comes in', focus: entry, text:
    entries.length + ' entry point' + (entries.length === 1 ? '' : 's') + ' on this map — menus and navigation programs. ' +
    entry.name + ' is the widest: it launches ' + entry.out.length + ' program' + (entry.out.length === 1 ? '' : 's') +
    ' directly. Beacons are menus; follow the gold roads to see everything a user can reach from here.'});

  t.push({title: 'The workhorse', focus: busiest, text:
    busiest.name + ' is the most connected object on the map — ' + busiest.out.length + ' outgoing and ' +
    busiest.inn.length + ' incoming relationships' + (busiest.lines ? ', ' + busiest.lines + ' lines of source' : '') +
    '. Tall buildings are load-bearing. Press B here to watch a change to it travel outwards hop by hop.',
    run(){ }});

  if(hub && hub.deg) t.push({title: 'Shared data, shared risk', focus: hub, text:
    hub.name + ' is the busiest data file on the map: ' + hub.deg + ' program' + (hub.deg === 1 ? '' : 's') +
    ' read or write it' + (hub.text ? ' (' + hub.text + ')' : '') + '. A field change here does not stay local — ' +
    'which is exactly the question the blast radius answers.'});

  if(batch && sbm.length) t.push({title: 'The batch backbone', focus: batch, text:
    sbm.length + ' submit relationship' + (sbm.length === 1 ? '' : 's') + ' on this map, drawn as red dashed lanes. ' +
    batch.name + ' submits ' + batch.out.filter(e => e.kind === 'SBMJOB').length + ' job' +
    (batch.out.filter(e => e.kind === 'SBMJOB').length === 1 ? '' : 's') +
    '. Night-time job chains are the part of an IBM i estate hand-written documentation almost always misses.'});

  if(xlinks.length) t.push({title: 'The library bridges', focus: xlinks[0].t, bridges: true, text:
    xlinks.length + ' relationship' + (xlinks.length === 1 ? '' : 's') + ' cross a library boundary — the golden arcs over the water. ' +
    'The build engine resolves scope one library at a time, so it marks every one of these out of scope; this map ' +
    're-resolves them by name, which is why the libraries read as one system here.' +
    (dangling.length ? ' ' + dangling.length + ' target' + (dangling.length === 1 ? '' : 's') +
      ' could not be resolved at all — those are the red piers on the shoreline (' +
      dangling.slice(0, 2).map(d => d.src + ' → ' + d.tgt).join(', ') + ').' : '')});

  if(fb.length) t.push({title: 'The unexplained ground', text:
    'The grey badlands on the rim are the fallback buckets — objects a lens could not place. The biggest is "' +
    fb[0].c.nm + '" in ' + fb[0].c.lib + ' under the ' + LENS[fb[0].X].label.toLowerCase() + ' lens: ' + fb[0].c.n +
    ' object' + (fb[0].c.n === 1 ? '' : 's') + '. That is not noise — it is the work list: every one of them is ' +
    'something the rules do not yet explain.',
    run(){ if(fb[0].X !== L) setLens(fb[0].X); drill(LENS[fb[0].X].byKey.get(fb[0].c.key)); }});

  if(srcOnly.length) t.push({title: 'Source without an object', focus: srcOnly[0], text:
    srcOnly.length + ' node' + (srcOnly.length === 1 ? ' is a source member' : 's are source members') +
    ' that never became a compiled object — mostly copybooks. They are drawn as ruins: a foundation, no tower. ' +
    'They are not dead code, and an activity bucket of NEVER on them means "no object", not "never used". ' +
    'Use Hide source-only when you are counting real objects.'});

  t.push({title: 'Your turn', text:
    'Click any building for its detail, the rule that grouped it and everything it touches. Click a territory name ' +
    'to dive into it, or switch lens at the top to watch the same objects migrate into new territories. ' +
    'B runs the blast radius from whatever is selected, / finds an object by name, R puts the world back.',
    run(){ drill(null); clearSel(); controls.setLookAt(...HOME(), !REDUCED); }});
  return t;
}

    $('crumb').classList.add('open');

    tip.innerHTML = '<b>' + esc(n.name) + '</b><div class="k">' + esc(kindOf(n).lab) + ' · ' + esc(n.lib) + '</div>' +
      esc(n.text || '(no description)') + '<div class="k" style="margin-top:4px">' +
      esc(LENS[L].prim.get(n.i).nm) + ' · fan ' + n.fin + '/' + n.fout + '</div>';
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';
    tip.style.top = Math.max(8, Math.min(innerHeight - hh - 8, e.clientY - hh - 12)) + 'px';
  }else tip.classList.remove('on');
});
renderer.domElement.addEventListener('pointerleave', () => tip.classList.remove('on'));

$('btnTour').onclick = () => tourIdx >= 0 ? tourExit() : tourShow(0);
$('tourNext').onclick = () => tourIdx >= TOUR.length - 1 ? tourExit() : tourShow(tourIdx + 1);
$('tourPrev').onclick = () => tourShow(Math.max(0, tourIdx - 1));
$('tourExit').onclick = tourExit;
$('btnBlast').onclick = () => blast ? endBlast() : startBlast();
$('blastExit').onclick = endBlast;
$('btnFlow').onclick = () => { flowOn = !flowOn; $('btnFlow').classList.toggle('on', flowOn);
  $('btnFlow').textContent = 'Flow: ' + (flowOn ? 'ON' : 'OFF'); };
$('btnTop').onclick = () => setTopDown(!topDown);
$('btnBridge').onclick = () => toggleBridges(!bridgeOnly);
$('btnReset').onclick = resetView;
$('infoClose').onclick = () => clearSel();
$('crumbHome').onclick = () => drill(null);
$('crumbX').onclick = () => drill(null);
$('legendHead').onclick = () => { $('legend').classList.toggle('min'); layoutPanels(); };
$('ctl').addEventListener('scroll', () => $('ctlMore').classList.toggle('on',
  $('ctl').scrollHeight - $('ctl').scrollTop > $('ctl').clientHeight + 8));
$('search').addEventListener('change', () => doSearch($('search').value));
$('search').addEventListener('keydown', e => { if(e.key === 'Enter') doSearch($('search').value); });
function doSearch(q){
  q = String(q || '').trim().toUpperCase();
  if(!q) return;
  let n = byKey.get(q) || nodes.find(z => z.name === q) ||
          nodes.find(z => z.id.toUpperCase() === q) ||
          nodes.find(z => z.name.indexOf(q) === 0) ||
          nodes.find(z => z.name.indexOf(q) >= 0 || (z.text || '').toUpperCase().indexOf(q) >= 0);
  if(n){ if(offLib.has(n.lib)){ offLib.delete(n.lib); buildFilters(); afterFilter(); }
    select(n, true); $('search').blur(); }
}
addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT'){ if(e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if(k === '/'){ e.preventDefault(); $('search').focus(); return; }
  if(k === 'Escape'){ if(blast) endBlast(); else if(tourIdx >= 0) tourExit(); else if(drilled) drill(null); else clearSel(); }
  if(k === 'b' || k === 'B'){ blast ? endBlast() : (sel && startBlast()); }
  if(k === 't' || k === 'T'){ tourIdx >= 0 ? tourExit() : tourShow(0); }
  if(k === 'r' || k === 'R'){ resetView(); }
  if(tourIdx >= 0 && k === 'ArrowRight'){ e.preventDefault(); $('tourNext').click(); return; }
  if(tourIdx >= 0 && k === 'ArrowLeft'){ e.preventDefault(); $('tourPrev').click(); return; }
  const A = 0.14;
  if(k === 'ArrowLeft'){ controls.rotate(A, 0, true); }
  if(k === 'ArrowRight'){ controls.rotate(-A, 0, true); }
  if(k === 'ArrowUp'){ controls.rotate(0, -A * .5, true); }
  if(k === 'ArrowDown'){ controls.rotate(0, A * .5, true); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  needRoads = true;
  layoutPanels();
});
controls.addEventListener('rest', () => syncHash());

/* ─── 23 · loop + adaptive quality ──────────────────────────────────────── */
let frames = 0, lastMini = 0, fps = 0, slow = 0, quality = 2, inFlight = false;
let fpsT = performance.now(), fpsF = 0;
function setQuality(q){
  if(q === quality) return;
  quality = q;
  bloomOn = q >= 1;
  buildPost();
  $('footBackend').textContent = BACKEND + (q < 2 ? (q < 1 ? ' · lo' : ' · med') : '');
}
async function draw(){
  if(inFlight) return;
  inFlight = true;
  try{ await (post ? post.renderAsync() : renderer.renderAsync(scene, camera)); }
  catch(e){ post = null; try{ await renderer.renderAsync(scene, camera); }catch(_){} }
  finally{ inFlight = false; frames++; window.__APPMAP && (window.__APPMAP.frames = frames); }
}
let prev = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden) { prev = now; return; }
  const dt = Math.min(.12, (now - prev) / 1000); prev = now;
  if(now - fpsT > 500){                                   /* drawn frames, not rAF ticks */
    fps = (frames - fpsF) * 1000 / (now - fpsT);
    fpsT = now; fpsF = frames;
    $('footFps').textContent = (fps < 10 ? fps.toFixed(1) : fps.toFixed(0)) + ' fps';
    if(!PIN_QUALITY){
      if(fps < 30) slow += .5; else slow = 0;              /* > 33 ms/frame for 2 s */
      if(slow >= 2 && quality > 0){ setQuality(quality - 1); slow = 0; }
    }
  }
  controls.update(dt);
  stepMorph(now);
  if(blast) stepBlast(now);
  if(needPlace) placeNodes();
  if(needPaint) paintNodes();
  if(needRoads || morphing) writeRoads();
  updateParticles(now * 0.001);
  updateLabels();
  if(now - lastMini > 200){ drawMini(); lastMini = now; }
  draw();
}

/* ─── 24 · boot ─────────────────────────────────────────────────────────── */
$('hdrRepo').textContent = D.repo || 'Application';
$('hdrLibs').textContent = LIBS.length + ' librar' + (LIBS.length === 1 ? 'y' : 'ies') + ': ' +
  LIBS.map(l => l.lib + ' (' + l.count + ')').join('  ·  ');
$('hdrSub').textContent =
  (D.built ? 'repository built ' + D.built : 'build date not recorded') +
  (D.generated ? ' · exported ' + String(D.generated).replace('T', ' ') : '') +
  (D.source ? ' · ' + D.source : '');
$('nodeNames').innerHTML = nodes.map(n => '<option value="' + esc(n.name) + '">' + esc(n.lib) + '</option>').join('');
$('btnBlast').disabled = true;
$('footBackend').textContent = BACKEND;
if(!flowOn){ $('btnFlow').classList.remove('on'); $('btnFlow').textContent = 'Flow: OFF'; }
buildLensBar(); buildFilters(); buildLegend(); paintStats();
placeNodes(); paintNodes(); writeRoads(); drawMini();
outlineMat.opacity = .55;

window.__APPMAP = {
  D, nodes, links, dangling, bridges, tiles, LIBS,
  KIND, LK, LENS, POS, NODE_POS, LAYOUT,
  backend: BACKEND, frames: 0, ready: false, reduced: REDUCED,
  get lens(){ return L; },
  get lenses(){ return schemeNames.slice(); },
  get sel(){ return sel; },
  get drilled(){ return drilled; },
  get blast(){ return blast; },
  get ripple(){ return blast; },
  get morphing(){ return morphing; },
  get quality(){ return quality; },
  get fps(){ return fps; },
  get TOUR(){ return TOUR; },
  get tourIdx(){ return tourIdx; },
  vis, linkVis, select, drill, setLens, tourShow, tourExit, setQuality,
  startRipple: startBlast, endRipple: endBlast, startBlast, endBlast,
  resetView, toggleBridges, setTopDown, doSearch, syncHash, readHash,
  nodeAt(id){ return byKey.get(id) || nodes.find(n => n.name === id) || null; },
  pos(n){ const o = (typeof n === 'number' ? n : n.i) * 3; return [POS[o], POS[o + 1], POS[o + 2]]; },
  visibleNodes(){ return nodes.filter(vis).length; },
  visibleLinks(){ return links.filter(linkVis).length; },
  clusterCounts(lensId){
    const X = lensId || L, out = {};
    for(const c of LENS[X].list) out[c.key] = c.n;
    return out;
  },
  clusterMembers(lensId){
    const X = lensId || L, out = {};
    for(const n of nodes){ const k = LENS[X].prim.get(n.i).key; (out[k] = out[k] || []).push(n.id); }
    return out;
  },
  territoryCells(lensId){
    const X = lensId || L, out = {};
    for(const l of LIBS) for(const [k, cells] of LAYOUT[X][l.lib].terr) out[k] = cells.length;
    return out;
  },
  filters(){ return {libs: [...offLib], kinds: [...offKind], links: [...offLink],
    groups: [...offGroup], hideSrc, bridgeOnly, flowOn, topDown, labelsOn}; },
  setFilter(what, key, off){
    const S = {lib: offLib, kind: offKind, link: offLink, group: offGroup}[what];
    if(!S) return false;
    off ? S.add(key) : S.delete(key);
    buildFilters(); afterFilter(); return true;
  },
  setHideSource(v){ hideSrc = !!v; buildFilters(); afterFilter(); },
  camera(){ const c = new THREE.Vector3(), t = new THREE.Vector3();
    controls.getPosition(c); controls.getTarget(t);
    return {pos: c.toArray(), target: t.toArray()}; },
  labelCount(){ return [...labelLayer.children].filter(e => e.style.display === 'block').length; },
  particlesVisible(){ return !!(partMesh && partMesh.visible); },
  screenOf(n){                                  /* where an object is on screen, for tests */
    const o = (typeof n === 'number' ? n : n.i) * 3;
    const p = project(POS[o], POS[o + 1] + n.h * .6, POS[o + 2]);
    return p ? {x: Math.round(p.x), y: Math.round(p.y)} : null;
  },
  coverage(){                                   /* screen box of the terrain, 0..1 */
    const v = new THREE.Vector3();
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, seen = 0;
    for(const t of tiles){
      if(offLib.has(t.lib)) continue;
      v.set(t.x, t.h, t.z).project(camera);
      if(v.z > 1) continue;
      seen++;
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
      y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    }
    if(!seen) return {w: 0, h: 0, x0: 0, x1: 0, y0: 0, y1: 0};
    return {w: (x1 - x0) / 2, h: (y1 - y0) / 2,
            x0: x0 / 2 + .5, x1: x1 / 2 + .5, y0: .5 - y1 / 2, y1: .5 - y0 / 2};
  },
  fill(lensId){                                 /* share of island tiles a lens builds on */
    const X = lensId || L;
    let used = 0;
    for(const l of LIBS) for(const t of LAYOUT[X][l.lib].owner.keys()) used++;
    return {used, tiles: tiles.length, pct: +(used / tiles.length * 100).toFixed(1)};
  },
  markerInfo(){
    const m = new THREE.Matrix4(), v = new THREE.Vector3(), out = {dup: [], pier: []};
    if(dupMesh) dupNodes.forEach((n, i) => { dupMesh.getMatrixAt(i, m); v.setFromMatrixPosition(m);
      out.dup.push({id: n.id, alt: n.alt, pos: v.toArray(), over: v.y > POS[n.i * 3 + 1]}); });
    if(pierMesh) dangling.forEach((d, i) => { pierMesh.getMatrixAt(i, m); v.setFromMatrixPosition(m);
      const l = libOf.get(d.s.lib);
      out.pier.push({src: d.src, tgt: d.tgt, pos: v.toArray(),
        offshore: Math.hypot(v.x - l.cx, v.z - l.cz) > l.radius}); });
    return out;
  }
};

if(!readHash()) syncHash();
requestAnimationFrame(loop);
(function waitFirstFrame(){
  if(frames > 0){ $('boot').classList.add('gone'); window.__APPMAP.ready = true; return; }
  requestAnimationFrame(waitFirstFrame);
})();
</script>
